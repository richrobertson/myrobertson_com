<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Oracle CNS OCI migration architecture</title>
  <desc id="desc">Transition-state GoldenGate replication and tenant waves moving into steady-state Kubernetes, Istio, and Terraform on OCI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1b3d" />
      <stop offset="100%" stop-color="#111d36" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="34" y="34" width="1132" height="562" rx="18" fill="none" stroke="#2f4f88" stroke-width="2" />

  <text x="70" y="92" fill="#dbe6ff" font-size="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">
    Oracle CNS OCI Migration
  </text>
  <text x="70" y="128" fill="#9bb6f5" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif">
    Transition-State to Steady-State Architecture
  </text>

  <rect x="70" y="170" width="510" height="360" rx="14" fill="#122347" stroke="#4968a8" />
  <text x="95" y="210" fill="#c7d7ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">
    Transition State
  </text>

  <rect x="95" y="236" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="111" y="270" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">GoldenGate Bi-Directional</text>

  <rect x="335" y="236" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="359" y="270" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Incremental Tenant Waves</text>

  <rect x="95" y="308" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="124" y="342" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Rollback Gate Checks</text>

  <rect x="335" y="308" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="346" y="342" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Prometheus Health Metrics</text>

  <text x="95" y="406" fill="#86a8ff" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">
    Real-time replication safety and migration control
  </text>

  <rect x="620" y="170" width="510" height="360" rx="14" fill="#0f1d3a" stroke="#5d80c8" />
  <text x="645" y="210" fill="#c7d7ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">
    Steady State (OCI)
  </text>

  <rect x="645" y="236" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="683" y="270" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Kubernetes + Istio</text>

  <rect x="885" y="236" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="924" y="270" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">API Gateway Edge</text>

  <rect x="645" y="308" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="657" y="342" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Object + Block Storage</text>

  <rect x="885" y="308" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="899" y="342" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Autonomous Oracle DB</text>

  <rect x="765" y="380" width="220" height="54" rx="8" fill="#0b1020" stroke="#2b3f6d" />
  <text x="822" y="414" fill="#e9ecf8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Terraform IaC</text>

  <text x="645" y="470" fill="#86a8ff" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">
    Scalable, policy-driven, reproducible platform operations
  </text>

  <line x1="584" y1="344" x2="618" y2="344" stroke="#80a9ff" stroke-width="4" />
  <polygon points="618,344 604,336 604,352" fill="#80a9ff" />
  <text x="548" y="326" fill="#80a9ff" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">Tenant-wave cutover</text>
