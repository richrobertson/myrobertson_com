name: Feature request
description: Suggest an improvement to content architecture, UX, or developer workflow.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or maintainer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the preferred behavior or design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives and tradeoffs.
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: UX, SEO, maintainability, or performance impact.
